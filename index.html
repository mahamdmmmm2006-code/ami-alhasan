<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محامص عمي الحسن | AH</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F33">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Tahoma, Arial, sans-serif;
}

body{
  background:#0B1F33;
  color:#fff;
  line-height:1.8;
}

.btn{
  display:inline-block;
  background:#D4AF37;
  color:#0B1F33;
  padding:14px 24px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  margin:6px;
  border:none;
  cursor:pointer;
}

/* HERO */
header{
  min-height:100vh;
  background:url("IMG_20260702_213950_590.webp") center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.hero{
  background:rgba(11,31,51,0.6);
  padding:25px;
  border-radius:25px;
  max-width:850px;
}

.logo-img{
  width:150px;
  height:150px;
  border-radius:50%;
  border:3px solid #D4AF37;
  margin-bottom:15px;
}

/* SECTIONS */
section{
  padding:60px 8%;
}

.section-title{
  text-align:center;
  color:#D4AF37;
  margin-bottom:25px;
  font-size:30px;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

.card{
  background:#102A43;
  padding:20px;
  border-radius:18px;
  border:1px solid rgba(212,175,55,0.3);
  text-align:center;
}

/* ITEMS */
.items-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
}

.item-card{
  background:#102A43;
  border-radius:18px;
  padding:12px;
  border:1px solid rgba(212,175,55,0.4);
  text-align:center;
  transition:0.3s;
}

.item-card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 30px rgba(0,0,0,0.4);
}

.item-img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:12px;
}

.price{
  margin-top:8px;
  color:#D4AF37;
  font-weight:bold;
}

/* CART */
#cartBox{
  position:fixed;
  bottom:15px;
  left:15px;
  width:270px;
  background:#102A43;
  border:2px solid #D4AF37;
  border-radius:15px;
  padding:12px;
  z-index:9999;
}

#cartBox h3{
  color:#D4AF37;
}

.cart-item{
  font-size:13px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  padding:5px 0;
}

.add-btn{
  width:100%;
  margin-top:8px;
  padding:8px;
  border-radius:20px;
  background:#D4AF37;
  color:#0B1F33;
  font-weight:bold;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div class="hero">
    <img class="logo-img" src="file_000000003bf472468f53586d998fb431.png">
    <h1>محامص عمي الحسن</h1>
    <p>أجود المكسرات والبزورات</p>
    <a class="btn" href="https://wa.me/31637022173">اطلب واتساب</a>
  </div>
</header>

<!-- PRODUCTS -->
<section>
<h2 class="section-title">المكسرات</h2>

<div class="items-grid">

  <div class="item-card">
    <img class="item-img" src="cashew-first.jpg">
    <h3>كاجو نوع أول</h3>
    <p class="price">14.99$ / كغ</p>
  </div>

  <div class="item-card">
    <img class="item-img" src="almond-first.jpg">
    <h3>لوز نوع أول</h3>
    <p class="price">14.99$ / كغ</p>
  </div>

  <div class="item-card">
    <img class="item-img" src="mixed-nuts-first.jpg">
    <h3>تشكيلة مكسرات</h3>
    <p class="price">14.99$ / كغ</p>
  </div>

</div>
</section>

<!-- CART -->
<div id="cartBox">
<h3>🛒 السلة</h3>

<div id="cartItems"></div>
<p id="total">المجموع: 0$</p>

<button class="add-btn" onclick="send()">إرسال واتساب</button>
<button class="add-btn" onclick="clearCart()">تفريغ</button>
</div>

<script>

let cart = [];

function add(name, price){
  cart.push({name, price});
  render();
}

function render(){
  let html="";
  let total=0;

  cart.forEach(i=>{
    html += `<div class="cart-item">${i.name} - ${i.price}$</div>`;
    total += i.price;
  });

  document.getElementById("cartItems").innerHTML = html;
  document.getElementById("total").innerText = "المجموع: " + total + "$";
}

function clearCart(){
  cart=[];
  render();
}

function send(){
  let msg="طلب جديد:%0A";

  cart.forEach(i=>{
    msg += "- "+i.name+" "+i.price+"$%0A";
  });

  window.open("https://wa.me/31637022173?text="+msg);
}

/* زر تلقائي */
window.onload=function(){
  document.querySelectorAll(".item-card").forEach(card=>{
    let name = card.querySelector("h3").innerText;
    let price = parseFloat(card.querySelector(".price").innerText);

    let btn = document.createElement("button");
    btn.className="add-btn";
    btn.innerText="أضف للسلة";

    btn.onclick=()=>add(name,price);

    card.appendChild(btn);
  });
};

</script>

</body>
</html>
