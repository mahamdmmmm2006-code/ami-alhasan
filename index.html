<!-- 🛒 السلة -->
<div id="cartBox">
  <h3>🛒 السلة</h3>
  <div id="cartItems"></div>
  <p id="cartTotal">المجموع: 0$</p>

  <button class="btn" onclick="sendOrder()">إرسال واتساب</button>
  <button class="btn" onclick="clearCart()">تفريغ</button>
</div>

<script>
let cart = [];

function addToCart(name, price){
  cart.push({name,price});
  renderCart();
}

function renderCart(){
  let box = document.getElementById("cartItems");
  let total = 0;

  box.innerHTML = "";

  cart.forEach(item=>{
    total += item.price;
    box.innerHTML += `<div>${item.name} - ${item.price}$</div>`;
  });

  document.getElementById("cartTotal").innerText = "المجموع: " + total + "$";
}

function clearCart(){
  cart = [];
  renderCart();
}

function sendOrder(){
  let msg = "طلب جديد:%0A";

  cart.forEach(i=>{
    msg += `- ${i.name} (${i.price}$)%0A`;
  });

  let url = "https://wa.me/31637022173?text=" + msg;
  window.open(url,"_blank");
}
</script>
