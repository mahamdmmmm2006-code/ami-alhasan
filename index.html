<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فواتير محامص عمي الحسن</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#0B1F33;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

h1{
  text-align:center;
  color:#D4AF37;
}

.card{
  background:#102A43;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:10px;
  margin-bottom:5px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #D4AF37;
  background:#0B1F33;
  color:white;
  font-size:16px;
}

button{
  border:0;
  padding:12px;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.gold{
  background:#D4AF37;
  color:#0B1F33;
  font-weight:bold;
}

.blue{
  background:#244c6d;
  color:white;
}

.red{
  background:#8b1e1e;
  color:white;
}

.full{
  width:100%;
}

.item{
  border-bottom:1px solid #345;
  padding-bottom:15px;
  margin-bottom:15px;
}

.total{
  font-size:22px;
  color:#D4AF37;
  font-weight:bold;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.invoice{
  background:white;
  color:black;
  padding:20px;
  display:none;
}

.invoice table{
  width:100%;
  border-collapse:collapse;
}

.invoice th,
.invoice td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}

.saved{
  background:#0B1F33;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
}

@media print{

  body *{
    visibility:hidden;
  }

  #invoice,
  #invoice *{
    visibility:visible;
  }

  #invoice{
    display:block !important;
    position:absolute;
    top:0;
    right:0;
    width:100%;
  }

}
</style>
</head>

<body>

<div class="container">

<h1>🧾 فواتير محامص عمي الحسن</h1>

<div class="card">

<label>رقم الفاتورة</label>
<input id="invoiceNumber">

<label>التاريخ</label>
<input id="date" type="date">

<label>اسم الزبون</label>
<input id="customer" placeholder="اسم الزبون">

<label>رقم الهاتف</label>
<input id="phone" placeholder="اختياري">

<label>العملة</label>

<select id="currency" onchange="calculate()">
<option value="€">يورو €</option>
<option value="$">دولار $</option>
<option value="ل.س">ليرة سورية</option>
</select>

</div>


<div class="card">

<h2>الأصناف</h2>

<div id="items"></div>

<button class="gold full" onclick="addItem()">
+ إضافة صنف
</button>

</div>


<div class="card">

<label>الخصم</label>
<input id="discount"
type="number"
value="0"
oninput="calculate()">

<label>الضريبة %</label>
<input id="tax"
type="number"
value="0"
oninput="calculate()">

<hr>

<p>
المجموع:
<strong id="subtotal">0</strong>
</p>

<p>
الضريبة:
<strong id="taxAmount">0</strong>
</p>

<p class="total">
الإجمالي:
<span id="total">0</span>
</p>

<label>ملاحظات</label>

<textarea id="notes"></textarea>


<div class="actions">

<button class="gold"
onclick="saveInvoice()">
💾 حفظ الفاتورة
</button>

<button class="blue"
onclick="printInvoice()">
🖨️ طباعة / PDF
</button>

</div>

</div>


<div class="card">

<h2>الفواتير المحفوظة</h2>

<div id="savedInvoices"></div>

</div>


<div id="invoice" class="invoice"></div>

</div>


<script>

let itemNumber=0;


function addItem(){

itemNumber++;

let div=document.createElement("div");

div.className="item";

div.innerHTML=`

<label>اسم الصنف</label>

<input
class="itemName"
placeholder="مثال: قهوة">

<label>الكمية</label>

<input
class="qty"
type="number"
value="1"
oninput="calculate()">

<label>السعر</label>

<input
class="price"
type="number"
value="0"
oninput="calculate()">

<br><br>

<button
class="red"
onclick="this.parentElement.remove();calculate()">

حذف الصنف

</button>

`;

document.getElementById("items").appendChild(div);

calculate();

}


function getItems(){

let items=[];

document.querySelectorAll(".item").forEach(function(row){

let name=row.querySelector(".itemName").value;

let qty=
Number(row.querySelector(".qty").value);

let price=
Number(row.querySelector(".price").value);

if(name || price){

items.push({
name:name,
qty:qty,
price:price
});

}

});

return items;

}


function calculate(){

let subtotal=0;

getItems().forEach(function(item){

subtotal+=item.qty*item.price;

});

let discount=
Number(document.getElementById("discount").value)||0;

let tax=
Number(document.getElementById("tax").value)||0;

let afterDiscount=
Math.max(0,subtotal-discount);

let taxAmount=
afterDiscount*(tax/100);

let total=
afterDiscount+taxAmount;

let currency=
document.getElementById("currency").value;

document.getElementById("subtotal").innerText=
subtotal.toFixed(2)+" "+currency;

document.getElementById("taxAmount").innerText=
taxAmount.toFixed(2)+" "+currency;

document.getElementById("total").innerText=
total.toFixed(2)+" "+currency;

return{
subtotal,
discount,
tax,
taxAmount,
total
};

}


function invoiceData(){

let totals=calculate();

return{

number:
document.getElementById("invoiceNumber").value,

date:
document.getElementById("date").value,

customer:
document.getElementById("customer").value,

phone:
document.getElementById("phone").value,

currency:
document.getElementById("currency").value,

notes:
document.getElementById("notes").value,

items:getItems(),

...totals

};

}


function saveInvoice(){

let invoice=invoiceData();

if(!invoice.customer){

alert("اكتب اسم الزبون");

return;

}

if(invoice.items.length===0){

alert("أضف صنف واحد على الأقل");

return;

}

let invoices=
JSON.parse(
localStorage.getItem("invoices") || "[]"
);

let existing=
invoices.findIndex(
x=>x.number===invoice.number
);

if(existing>=0){

invoices[existing]=invoice;

}else{

invoices.unshift(invoice);

}

localStorage.setItem(
"invoices",
JSON.stringify(invoices)
);

showSaved();

alert("تم حفظ الفاتورة ✅");

}


function showSaved(){

let invoices=
JSON.parse(
localStorage.getItem("invoices") || "[]"
);

let box=
document.getElementById("savedInvoices");

box.innerHTML="";

if(invoices.length===0){

box.innerHTML="لا توجد فواتير محفوظة";

return;

}

invoices.forEach(function(inv,index){

let div=
document.createElement("div");

div.className="saved";

div.innerHTML=`

<strong>
${inv.number}
</strong>

<br>

${inv.customer}

<br>

${inv.total.toFixed(2)}
${inv.currency}

<br><br>

<button
class="blue"
onclick="loadInvoice(${index})">

فتح

</button>

<button
class="red"
onclick="deleteInvoice(${index})">

حذف

</button>

`;

box.appendChild(div);

});

}


function loadInvoice(index){

let invoices=
JSON.parse(
localStorage.getItem("invoices") || "[]"
);

let inv=invoices[index];

document.getElementById("invoiceNumber").value=
inv.number;

document.getElementById("date").value=
inv.date;

document.getElementById("customer").value=
inv.customer;

document.getElementById("phone").value=
inv.phone;

document.getElementById("currency").value=
inv.currency;

document.getElementById("discount").value=
inv.discount;

document.getElementById("tax").value=
inv.tax;

document.getElementById("notes").value=
inv.notes;

document.getElementById("items").innerHTML="";

inv.items.forEach(function(item){

addItem();

let rows=
document.querySelectorAll(".item");

let row=
rows[rows.length-1];

row.querySelector(".itemName").value=
item.name;

row.querySelector(".qty").value=
item.qty;

row.querySelector(".price").value=
item.price;

});

calculate();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function deleteInvoice(index){

if(!confirm("هل تريد حذف الفاتورة؟"))
return;

let invoices=
JSON.parse(
localStorage.getItem("invoices") || "[]"
);

invoices.splice(index,1);

localStorage.setItem(
"invoices",
JSON.stringify(invoices)
);

showSaved();

}


function buildInvoice(){

let inv=invoiceData();

let rows="";

inv.items.forEach(function(item,index){

rows+=`

<tr>

<td>${index+1}</td>

<td>${item.name}</td>

<td>${item.qty}</td>

<td>
${item.price.toFixed(2)}
${inv.currency}
</td>

<td>
${(item.qty*item.price).toFixed(2)}
${inv.currency}
</td>

</tr>

`;

});


document.getElementById("invoice").innerHTML=`

<h1 style="color:black">
محامص عمي الحسن
</h1>

<h2>
فاتورة مبيعات
</h2>

<p>
<strong>
رقم الفاتورة:
</strong>

${inv.number}
</p>

<p>
<strong>
التاريخ:
</strong>

${inv.date}
</p>

<p>
<strong>
الزبون:
</strong>

${inv.customer}
</p>

<p>
<strong>
الهاتف:
</strong>

${inv.phone || "-"}
</p>


<table>

<thead>

<tr>

<th>#</th>

<th>الصنف</th>

<th>الكمية</th>

<th>السعر</th>

<th>المجموع</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>


<br>

<p>
المجموع:
${inv.subtotal.toFixed(2)}
${inv.currency}
</p>

<p>
الخصم:
${inv.discount.toFixed(2)}
${inv.currency}
</p>

<p>
الضريبة:
${inv.taxAmount.toFixed(2)}
${inv.currency}
</p>

<h2>
الإجمالي:
${inv.total.toFixed(2)}
${inv.currency}
</h2>

<p>
${inv.notes}
</p>

`;

}


function printInvoice(){

buildInvoice();

document.getElementById("invoice").style.display=
"block";

window.print();

}


function newInvoice(){

document.getElementById("invoiceNumber").value=
"AH-"+Date.now().toString().slice(-6);

document.getElementById("date").value=
new Date().toISOString().split("T")[0];

}


newInvoice();

addItem();

showSaved();

</script>

</body>
</html>
